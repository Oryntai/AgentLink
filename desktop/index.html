<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>AgentLink</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9; --panel: #ffffff; --ink: #14161a; --muted: #5d6470;
    --line: #e3e6ea; --ok: #157f4a; --warn: #9a6b00; --bad: #a32020;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --panel: #1c1f25; --ink: #eef1f5; --muted: #99a1ad;
      --line: #2b3038; --ok: #4ec98a; --warn: #e0b34d; --bad: #ef7a7a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 16px 22px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 2;
  }
  h1 { font-size: 16px; margin: 0; letter-spacing: -0.01em; }
  .path { color: var(--muted); font-size: 11px; font-family: ui-monospace, monospace; }
  main { padding: 18px 22px 36px; display: grid; gap: 16px; max-width: 940px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  section > h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
    margin: 0; padding: 11px 16px; border-bottom: 1px solid var(--line); font-weight: 600;
  }
  .rows { padding: 4px 16px 12px; }
  .row { display: flex; justify-content: space-between; gap: 16px; padding: 7px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .k { color: var(--muted); }
  .v { font-family: ui-monospace, monospace; font-size: 13px; text-align: right; word-break: break-all; }
  .pill {
    display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px;
    font-family: system-ui, sans-serif; border: 1px solid currentColor;
  }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .scroll { max-height: 300px; overflow: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; color: var(--muted); font-weight: 500; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.06em; padding: 8px 16px;
    position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  td { padding: 7px 16px; border-bottom: 1px solid var(--line); font-family: ui-monospace, monospace; }
  tr:last-child td { border-bottom: 0; }
  .empty { padding: 16px; color: var(--muted); }
  footer { padding: 0 22px 26px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>AgentLink</h1>
  <span id="link" class="pill warn">connecting</span>
  <span class="path" id="config"></span>
</header>
<main>
  <section><h2>Link</h2><div class="rows" id="link-rows"></div></section>
  <section><h2>Peer</h2><div class="rows" id="peer-rows"></div></section>
  <section><h2>Pending requests</h2><div class="scroll" id="inbox"></div></section>
  <section><h2>Activity (metadata only)</h2><div class="scroll" id="activity"></div></section>
</main>
<footer>Reads the local broker over authenticated IPC. Message text is never shown here.</footer>
<script src="renderer.js"></script>
</body>
</html>
